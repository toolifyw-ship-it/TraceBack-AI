<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>TraceBack AI • Protect Your Digital Identity</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, OAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyC1LTHQjjsS6v3KQzeeSVVKAqYqWrQnOm0",
            authDomain: "traceback-ai-1c105.firebaseapp.com",
            projectId: "traceback-ai-1c105",
            storageBucket: "traceback-ai-1c105.firebasestorage.app",
            messagingSenderId: "926035748812",
            appId: "1:926035748812:web:bcfcc8a2c9c96842c59f69",
            measurementId: "G-6HD9BV4FEJ"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Offline সাপোর্ট যোগ করা হয়েছে যাতে "Client is offline" এরর না আসে
        enableIndexedDbPersistence(db).catch((err) => {
            console.log("Persistence failed", err.code);
        });

        const googleProvider = new GoogleAuthProvider();
        
        window.firebaseSignInWithGoogle = async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await handleUserDocument(result.user);
                return result.user;
            } catch (error) {
                window.showToast?.(error.message, 'error');
            }
        };

        async function handleUserDocument(user) {
            try {
                const userRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userRef);
                const now = new Date().toISOString();
                
                if (!userDoc.exists()) {
                    const trialEnd = new Date();
                    trialEnd.setDate(trialEnd.getDate() + 7);
                    await setDoc(userRef, {
                        email: user.email,
                        name: user.displayName || "User",
                        photoURL: user.photoURL,
                        createdAt: now,
                        plan: 'trial',
                        trialEnd: trialEnd.toISOString()
                    });
                } else {
                    await updateDoc(userRef, { lastLogin: now });
                }
            } catch (e) {
                console.error("Database Error:", e);
                // যদি ডাটাবেস রুলস ভুল থাকে তবে এখানে এরর ধরা পড়বে
            }
        }

        window.firebaseSignOut = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.handleFirebaseSignIn(user);
            } else {
                window.handleFirebaseSignOutUI();
            }
        });
    </script>
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #03050b; color: #eef2ff; min-height: 100vh; }
        .glass { background: rgba(18, 25, 40, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(79, 70, 229, 0.2); border-radius: 2rem; }
        .btn-primary { background: linear-gradient(145deg, #4f46e5, #7c3aed); transition: 0.3s; }
        .modal-overlay { background: rgba(2, 6, 18, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body>

<div id="toastContainer" class="fixed bottom-5 right-5 z-[9999]"></div>

<div id="authModal" class="fixed inset-0 modal-overlay z-[100] flex items-center justify-center p-4">
    <div class="glass w-full max-w-md p-8 text-center border-indigo-500/30">
        <div id="step1">
            <h2 class="text-2xl font-bold mb-2">Verify Your Age</h2>
            <input type="date" id="dobInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 mb-4 text-white">
            <button onclick="verifyAge()" class="w-full btn-primary py-3 rounded-xl font-bold">Continue</button>
        </div>
        <div id="step2" class="hidden">
            <h2 class="text-2xl font-bold mb-2 text-indigo-400">Welcome</h2>
            <p class="text-slate-400 mb-8">Sign in to start your 7‑day free trial</p>
            <button onclick="handleGoogleSignIn()" class="w-full flex items-center justify-center gap-3 bg-white/10 hover:bg-white/20 border border-slate-700 py-4 rounded-xl mb-4 transition">
                <i class="fab fa-google text-red-400"></i> <span>Continue with Google</span>
            </button>
            <p class="text-xs text-slate-500">Secure AES-256 Authentication</p>
        </div>
    </div>
</div>

<nav class="p-4 glass m-4 flex justify-between items-center">
    <h1 class="font-bold text-xl text-indigo-400">TraceBack AI</h1>
    <div id="userArea" class="flex items-center gap-3"></div>
</nav>

<main class="text-center py-20 px-4">
    <h1 class="text-5xl font-black mb-6">Your Digital Safety <span class="text-indigo-500">Starts Here</span></h1>
    <div class="max-w-2xl mx-auto bg-slate-900/50 p-2 rounded-2xl border border-indigo-500/20 flex">
        <input type="text" id="searchInput" placeholder="Enter email to scan..." class="flex-1 bg-transparent p-4 outline-none" disabled>
        <button id="searchBtn" class="btn-primary px-8 rounded-xl opacity-50" disabled>Scan</button>
    </div>
</nav>

<script>
    AOS.init();

    window.verifyAge = () => {
        if(!document.getElementById('dobInput').value) return alert('Please enter DOB');
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
    };

    window.handleGoogleSignIn = async () => {
        await window.firebaseSignInWithGoogle();
    };

    window.handleFirebaseSignIn = (user) => {
        document.getElementById('authModal').classList.add('hidden');
        document.getElementById('searchInput').disabled = false;
        document.getElementById('searchBtn').disabled = false;
        document.getElementById('searchBtn').classList.remove('opacity-50');
        document.getElementById('userArea').innerHTML = `
            <span class="text-sm">${user.displayName}</span>
            <button onclick="window.firebaseSignOut()" class="bg-red-500/20 text-red-400 px-3 py-1 rounded-lg text-xs">Logout</button>
        `;
    };

    window.handleFirebaseSignOutUI = () => {
        document.getElementById('authModal').classList.remove('hidden');
        document.getElementById('userArea').innerHTML = '';
    };
</script>
</body>
</html>
