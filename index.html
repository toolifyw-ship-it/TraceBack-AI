<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Trace Back AI</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
    <script>
        // SEO friendly canonical redirect
        window.location.replace("https://trace-back-ai.netlify.app/");
    </script>
</head>
<body>
    <div class="container">
        <h2>We have moved!</h2>
        <p>Please wait while we redirect you to our new home...</p>
        <p>If not redirected, <a href="https://trace-back-ai.netlify.app/">click here</a>.</p>
    </div>
</body>
</html>
